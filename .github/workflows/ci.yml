name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  forge-test:
    name: Forge Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: ./scripts/setup-shielded-deps.sh

      - name: Build
        run: forge build

      - name: Test
        run: forge test

  sdk-test:
    name: SDK Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/shielded-sdk

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run tests (skip proof tests that need circuit artifacts)
        run: npx vitest run --exclude 'test/proof*.test.ts'

  sp1-contracts:
    name: SP1 Contract Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sp1-batch/contracts

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: |
          mkdir -p lib
          git clone --depth 1 --branch v1.15.0 --single-branch https://github.com/foundry-rs/forge-std.git lib/forge-std
          test "$(git -C lib/forge-std rev-parse HEAD)" = "0844d7e1fc5e60d77b68e469bff60265f236c398"
          git clone --depth 1 --branch v5.6.1 --single-branch https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts
          test "$(git -C lib/openzeppelin-contracts rev-parse HEAD)" = "5fd1781b1454fd1ef8e722282f86f9293cacf256"

      - name: Build
        run: forge build

      - name: Test
        run: forge test
