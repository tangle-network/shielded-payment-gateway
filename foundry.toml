[profile.default]
bytecode_hash = "none"
fuzz = { runs = 1_000 }
gas_reports = ["*"]
libs = ["dependencies"]
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./" }]
solc = "0.8.26"
evm_version = "cancun"
via_ir = true
allow_internal_expect_revert = true

[profile.fast]
via_ir = true
optimizer = false
sparse_mode = true
gas_reports = []
fuzz = { runs = 256 }

[fmt]
bracket_spacing = true
int_types = "long"
line_length = 120
multiline_func_header = "all"
number_underscore = "thousands"
quote_style = "double"
tab_width = 4
wrap_comments = true

[invariant]
fail_on_revert = false
runs = 256
depth = 120

[dependencies]
forge-std = "1.9.4"
"@openzeppelin-contracts" = "5.1.0"
# protocol-solidity (audited against OZ 4.x) imports paths removed/moved in OZ 5.x.
# Pinned to the soldeer-hosted 4.9.6 release zip; selected via a context remapping
# so only files under dependencies/protocol-solidity/ resolve OZ 4.x.
"@openzeppelin-contracts-4" = { version = "4.9.6", url = "https://soldeer-revisions.s3.amazonaws.com/@openzeppelin-contracts/4_9_6_14-03-2024_06:11:55_contracts.zip" }
